# ParaKarsa / EntreID — satu domain, dua proses.
#
#   /        -> Next.js  (127.0.0.1:3000)
#   /api/    -> NestJS   (127.0.0.1:4000)
#
# Menyatukan keduanya di satu origin membuat cookie sesi jadi same-origin:
# tidak perlu CORS, dan callback e.id punya alamat HTTPS yang stabil.
#
# Pasang di /etc/nginx/sites-available/parakarsa.conf lalu symlink ke
# sites-enabled/. Ganti parakarsa.id dengan domain .id Anda.

# Nilai Connection yang benar bergantung pada ada tidaknya header Upgrade:
# koneksi biasa harus tetap keep-alive, hanya WebSocket yang di-upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name parakarsa.id www.parakarsa.id;

    # Certbot menaruh berkas tantangan di sini; biarkan lewat tanpa redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parakarsa.id www.parakarsa.id;

    ssl_certificate     /etc/letsencrypt/live/parakarsa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parakarsa.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS baru dinyalakan setelah yakin seluruh alur berjalan di HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6M;   # unggahan sertifikat LMS maksimal 5 MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/parakarsa.access.log;
    error_log  /var/log/nginx/parakarsa.error.log;

    # Callback e.id, seluruh REST API, dan WebSocket realtime (/api/socket.io).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Dibaca 'trust proxy' di NestJS supaya cookie sesi terbit dengan Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tanpa dua baris ini, upgrade WebSocket ditolak dan realtime PRD 3.3
        # diam-diam turun jadi long-polling.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Koneksi WebSocket menganggur lama; jangan diputus di tengah demo.
        proxy_read_timeout 300s;
    }

    # Berkas statis Next punya hash di namanya, jadi aman di-cache lama.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
